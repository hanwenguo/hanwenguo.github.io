<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><p><a href="/AFGT14/">/AFGT14/</a><br><a href="/ATT25/">/ATT25/</a><br><a href="/CD24/">/CD24/</a><br><a href="/CKC24/">/CKC24/</a><br><a href="/CL17/">/CL17/</a><br><a href="/CLLN22a/">/CLLN22a/</a><br><a href="/CLNL22/">/CLNL22/</a><br><a href="/CLPS19/">/CLPS19/</a><br><a href="/Cas24/">/Cas24/</a><br><a href="/GCT16/">/GCT16/</a><br><a href="/GG25/">/GG25/</a><br><a href="/HTF10/">/HTF10/</a><br><a href="/II11/">/II11/</a><br><a href="/JTTT25/">/JTTT25/</a><br><a href="/Lan21/">/Lan21/</a><br><a href="/MNTH20/">/MNTH20/</a><br><a href="/MSI19/">/MSI19/</a><br><a href="/PXY-23/">/PXY-23/</a><br><a href="/SV08/">/SV08/</a><br><a href="/SVCB15/">/SVCB15/</a><br><a href="/SW10/">/SW10/</a><br><a href="/TGT18/">/TGT18/</a><br><a href="/WNL-10/">/WNL-10/</a><br></p></body></html>
